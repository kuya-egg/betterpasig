<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<title>BetterPasig mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,300..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A47A8;text-decoration:none}
button,input{font-family:'Mona Sans',system-ui,sans-serif}
input::placeholder{color:#7C8391}
:focus-visible{outline:3px solid #1A47A8;outline-offset:3px;border-radius:8px}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow-y: auto; font-family: 'Mona Sans', system-ui, sans-serif; color: #15171C; background: #F3F5F9; font-size: 17px; line-height: 1.5;">

<header style="background: #FFFFFF; border-bottom: 1px solid #E6E9F0; height: 58px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;">
<a href="#" aria-label="BetterPasig, home" style="display: flex; align-items: center; gap: 8px; color: #15171C;">
<svg width="22" height="22" viewBox="0 0 36 36" aria-hidden="true"><path d="M3 14c5-4.6 10-4.6 15 0s10 4.6 15 0" stroke="{{blue}}" stroke-width="4.5" fill="none" stroke-linecap="round"></path><path d="M3 23c5-4.6 10-4.6 15 0s10 4.6 15 0" stroke="{{blue}}" stroke-width="4.5" fill="none" stroke-linecap="round"></path></svg>
<span style="font-size: 17px; font-weight: 700;">BetterPasig</span>
</a>
<button aria-label="Buksan ang menu" style="background: #F3F5F9; border: 0; border-radius: 999px; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#15171C" stroke-width="2.2" stroke-linecap="round"><path d="M4 8h16M4 16h16"></path></svg>
</button>
</header>

<!-- Emergency first -->
<section style="padding: 12px 12px 0;">
<div style="background: #FFFFFF; border-radius: 22px; padding: 16px; border-top: 5px solid #C4291C; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 15px; font-weight: 700;">Kapag may emergency</span>
<a href="tel:86430000" style="display: flex; justify-content: space-between; align-items: center; background: #FCEDEB; border-radius: 14px; padding: 12px 14px; color: #15171C; margin-top: 6px;">
<span style="display: flex; flex-direction: column;"><span style="font-size: 13px; color: #8A1F14; font-weight: 600;">Pasig Emergency Hotline</span><span style="font-size: 26px; font-weight: 700; font-stretch: 110%; color: #C4291C; line-height: 1.15;">8643-0000</span></span>
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#C4291C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.7 2.8-1.8 3.4a16 16 0 0 0 6 6l3.4-1.8 2.8.7a2 2 0 0 1 1.7 2z"></path></svg>
</a>
<sc-for list="{{hotlines}}" as="h" hint-placeholder-count="3">
<a href="tel:{{h.tel}}" style="display: flex; justify-content: space-between; padding: 11px 4px; border-bottom: 1px solid #EEF0F4; color: #15171C; min-height: 44px; box-sizing: border-box;">
<span style="font-size: 15px;">{{h.name}}</span><strong style="font-size: 16px;">{{h.num}}</strong>
</a>
</sc-for>
</div>
</section>

<!-- Search -->
<section style="padding: 12px;">
<div style="background: #FFFFFF; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px;">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; font-stretch: 108%; letter-spacing: -0.025em; line-height: 1.1;">Lahat ng serbisyo ng Lungsod ng Pasig</h1>
<form role="search" style="display: flex; align-items: center; gap: 8px; border: 1.5px solid #CBD2DE; border-radius: 999px; padding: 4px 4px 4px 16px;">
<label for="mq" style="position: absolute; left: -9999px;">Maghanap ng serbisyo</label>
<input id="mq" type="search" value="{{query}}" onChange="{{onQuery}}" placeholder="Hal. amilyar, scholarship" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; font-size: 16px; padding: 10px 0; background: transparent; color: #15171C;">
<button type="button" aria-label="Hanapin" style="background: {{blue}}; border: 0; border-radius: 999px; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
</button>
</form>
<sc-if value="{{hasQuery}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column;">
<sc-for list="{{results}}" as="r" hint-placeholder-count="3">
<a href="#" style="padding: 10px 2px; border-top: 1px solid #EEF0F4; font-size: 16px; font-weight: 500;">{{r}}</a>
</sc-for>
</div>
</sc-if>
</div>
</section>

<!-- Key info -->
<section style="padding: 0 0 12px;">
<div style="display: flex; gap: 10px; overflow-x: auto; padding: 0 12px;">
<sc-for list="{{keyInfo}}" as="k" hint-placeholder-count="3">
<a href="#" style="flex: 0 0 250px; background: #FFFFFF; border-radius: 20px; padding: 16px; color: #15171C; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; color: {{blue}}; font-weight: 600;">{{k.kicker}}</span>
<span style="font-size: 16px; font-weight: 700; line-height: 1.25;">{{k.title}}</span>
</a>
</sc-for>
</div>
</section>

<!-- Categories -->
<section style="padding: 4px 12px 24px; display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 4px 4px 2px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em;">Mga serbisyo</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<sc-for list="{{cats}}" as="ct" hint-placeholder-count="12">
<a href="#" style="background: #FFFFFF; border-radius: 18px; padding: 14px; color: #15171C; display: flex; flex-direction: column; gap: 8px; min-height: 108px; box-sizing: border-box;">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{blue}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ct.icon}}"></path></svg>
<span style="font-size: 15px; font-weight: 700; line-height: 1.25;">{{ct.name}}</span>
<span style="font-size: 13px; color: #4F5664;">{{ct.n}} serbisyo</span>
</a>
</sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"blue":{"editor":"color","default":"#1A47A8","options":["#1A47A8","#1440A0","#0F3B8C","#2456C7"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { query: '' }; }
renderVals() {
const all = ['Magbayad ng amilyar (real property tax)', 'I-renew ang business permit', 'Kumuha ng kopya ng birth certificate', 'Kumuha ng Senior Citizen ID', 'Tulong pinansyal (AICS)', 'Mag-apply ng Pasig City scholarship', 'Maghanap ng trabaho sa PESO', 'Magreklamo sa Ugnayan sa Pasig'];
const q = this.state.query.trim().toLowerCase();
const hits = q ? all.filter((x) => x.toLowerCase().indexOf(q) !== -1) : [];
return {
blue: this.props.blue ?? '#1A47A8',
query: this.state.query,
hasQuery: q.length > 0,
results: hits.length ? hits : ['Walang tugma. Tingnan ang mga kategorya sa ibaba.'],
hotlines: [
{ name: 'Text (KaTXT)', num: '0908-899-3333', tel: '09088993333' },
{ name: 'National emergency', num: '911', tel: '911' },
{ name: 'City Hall', num: '8643-1111', tel: '86431111' }
],
keyInfo: [
{ kicker: 'Lugar ng City Hall', title: 'Nasa Bridgetowne, Brgy. Rosario ang Temporary City Hall' },
{ kicker: 'Amilyar', title: '15% discount kung buong taon bayad bago Dis. 31' },
{ kicker: 'Senior citizen', title: '₱500 kada buwan na pensyon para sa indigent na senior, 65 pataas' }
],
cats: [
{ name: 'Sibil na rehistro at dokumento', n: 16, icon: 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6' },
{ name: 'Negosyo at permit', n: 24, icon: 'M3 21h18M5 21V8l7-5 7 5v13M9 21v-5h6v5' },
{ name: 'Ari-arian, buwis at bayarin', n: 19, icon: 'M2 7h20v10H2zM2 11h20M6 15h4' },
{ name: 'Gusali, zoning at lupa', n: 12, icon: 'M4 21V10l8-6 8 6v11M4 21h16M10 21v-4h4v4' },
{ name: 'Kalusugan', n: 17, icon: 'M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z' },
{ name: 'Tulong panlipunan', n: 22, icon: 'M12 7a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM5 22v-5a7 7 0 0 1 14 0v5' },
{ name: 'Edukasyon at scholarship', n: 13, icon: 'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5' },
{ name: 'Trabaho at kabuhayan', n: 7, icon: 'M3 7h18v13H3zM8 7V4h8v3M3 13h18' },
{ name: 'Kalikasan at hayop', n: 11, icon: 'M5 21c0-9 6-15 15-16-1 9-7 15-15 16zM5 21l7-7' },
{ name: 'Kaligtasan, sakuna at trapiko', n: 14, icon: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z' },
{ name: 'Transparency at reklamo', n: 9, icon: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z' },
{ name: 'Pabahay at pasilidad', n: 9, icon: 'M3 10l9-7 9 7M5 9v12h14V9M10 21v-6h4v6' }
],
onQuery: (e) => this.setState({ query: e.target.value })
};
}
}
</script>
</body>
</html>
