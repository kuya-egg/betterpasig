<span style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em;">BetterPasig</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; flex: 0 0 96px;">
<div style="background: #FFFFFF; border: 1px solid #E6E9F0; border-radius: 14px; height: 70px; display: flex; align-items: center; justify-content: center;">

</div>
<div style="background: #1A47A8; border-radius: 14px; height: 70px; display: flex; align-items: center; justify-content: center;">
<svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.d}}"></path><path d="{{m.d2}}" fill="{{m.fillInv}}" stroke="{{m.stroke2Inv}}"></path><path d="{{m.d3}}" stroke="{{m.s3Inv}}"></path></svg>
</div>
</div>
</div>
</div>
</sc-for>
</div>
<div style="border: 1px solid #E6E9F0; border-radius: 24px; padding: 24px; display: flex; align-items: center; gap: 48px;">
<strong style="font-size: 20px; flex: 0 0 auto;">G. Wordmark lang</strong>
<span style="display: inline-flex; align-items: flex-end; font-size: 54px; font-weight: 700; letter-spacing: -0.035em; line-height: 1;">better<span style="color: #1A47A8; display: inline-flex; align-items: flex-end;">pas<span style="position: relative; display: inline-block;">ı<svg width="22" height="10" viewBox="0 0 22 10" aria-hidden="true" style="position: absolute; left: 50%; top: -6px; transform: translateX(-50%);"><path d="M2 6c3-3 6-3 9 0s6 3 9 0" stroke="#1A47A8" stroke-width="3.2" fill="none" stroke-linecap="round"></path></svg></span>g</span></span>
<span style="font-size: 16px; color: #4F5664; max-width: 520px;">Walang hiwalay na simbolo. Ang tuldok ng "i" ay maliit na alon ng Ilog Pasig. Pinakasimple at hindi mukhang pang-gobyerno.</span>
</div>
