<a href="#" aria-label="BetterPasig, home" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #16181D;">

<h1 style="margin: 0; font-size: 34px; line-height: 1.05; letter-spacing: -0.04em; font-weight: 700;">Paano ka namin matutulungan?</h1>
<form role="search" style="display: flex; border: 2px solid #16181D; border-radius: 10px; overflow: hidden;">
<label for="mq" style="position: absolute; left: -9999px;">Maghanap ng serbisyo</label>
<input id="mq" type="search" placeholder="Hal. amilyar" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; font: 500 16px 'Geist', sans-serif; padding: 13px 14px; color: #16181D;">

</form>
</section>

<section style="padding: 0 16px 24px;">
<div style="display: flex; gap: 14px; align-items: flex-start; border-top: 2px solid #16181D; padding-top: 14px;">
<svg viewBox="100 0 360 560" role="img" aria-label="Mapa ng 30 barangay ng Pasig" style="width: 112px; height: auto; flex: 0 0 112px;">
<sc-for list="{{map}}" as="b" hint-placeholder-count="30">
<a href="#" onClick="{{b.pick}}" aria-label="{{b.name}}"><path d="{{b.d}}" fill="{{b.fill}}" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"></path></a>
</sc-for>
</svg>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; color: #586070;">Ang barangay mo</span>
<strong style="font-size: 22px; letter-spacing: -0.02em; line-height: 1.15;">{{brgy}}</strong>
<span style="font-size: 14px; color: #586070;">{{district}}</span>
<span style="font-size: 13px; color: #8A5A00;">Hotline at address: sinusuri pa</span>
<a href="#" style="font-size: 14px; font-weight: 500; margin-top: 4px;">Pindutin ang mapa para pumili</a>
</div>
</div>
</section>

<h2 style="margin: 0 0 4px; font-size: 22px; letter-spacing: -0.03em;">Mga serbisyo</h2>

<a class="bp-plain" href="#" style="display: flex; justify-content: space-between; padding: 13px 0; border-top: 1px solid #E2E5EB; font-weight: 500; min-height: 48px; box-sizing: border-box;"><span>{{c.name}}</span><span style="color: #586070; font-weight: 400;">{{c.n}}</span></a>

</section>
